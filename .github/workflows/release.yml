name: Release module versions

on:
  push:
    branches: [main]

permissions:
  contents: write              # needed to create tags and releases

concurrency:
  group: release
  cancel-in-progress: false    # never run two releases at once

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history and tags
      - name: Set the author for tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Create tags and releases for new module versions
        run: python3 scripts/release_tags.py --push --github-release
        env:
          GH_TOKEN: ${{ github.token }}
