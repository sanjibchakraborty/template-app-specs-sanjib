name: Check module versions

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history and tags, needed to compare with main
      - name: Check versions and changelogs
        run: python3 scripts/check_versions.py --base origin/${{ github.base_ref }}
